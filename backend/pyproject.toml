[project]
name = "backend"
version = "0.1.0"
description = "ContWatch v2 backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.134.0",
    "httpx>=0.28.1",
    "minimalmodbus>=2.1",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.11.0",
    "python-multipart>=0.0.27",
    "python-socketio>=5.16.1",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.47",
    "uvicorn[standard]>=0.41.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pip-audit>=2.10.0",
    "psycopg[binary]>=3.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # Depends() in function defaults is standard FastAPI DI

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Test JWT secret is intentionally short; suppress PyJWT warning in tests
    "ignore:The HMAC key is.*:jwt.warnings.InsecureKeyLengthWarning",
    # Python 3.12+ deprecated the default sqlite3 date/datetime adapters; suppress until aiosqlite adapts
    "ignore:The default .* adapter is deprecated:DeprecationWarning",
]
