services:
  db-v2:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db-v2:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db-v2
    device_cgroup_rules:
      - 'c 188:* rmw'   # /dev/ttyUSB*
      - 'c 166:* rmw'   # /dev/ttyACM*
    volumes:
      - /dev:/dev
      - /etc/hostname:/etc/host_hostname:ro

  frontend-build:
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    volumes:
      - frontend_dist:/app/dist

volumes:
  pgdata-v2:
  frontend_dist:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FRONTEND_DIST_PATH:-./frontend/dist}
