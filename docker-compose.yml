services:
  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: contwatch
      POSTGRES_PASSWORD: contwatch
      POSTGRES_DB: contwatch
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
